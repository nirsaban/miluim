        http2 on;
        server_name sabanenglish.miltech.cloud;

        ssl_certificate     /etc/letsencrypt/live/sabanenglish.miltech.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sabanenglish.miltech.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SabanSSL:10m;

        client_max_body_size 10M;

        location / {
            proxy_pass http://172.22.0.1:4010;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;   # AI calls can take up to ~60s
            proxy_send_timeout 120s;
        }
    }



    # ---- wabot.miltech.cloud (Kesher) HTTP -> HTTPS + ACME ----
    server {
        listen 80;
        server_name wabot.miltech.cloud;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ---- wabot.miltech.cloud (Kesher) HTTPS -> host :4000 ----
    server {
        listen 443 ssl;
        http2 on;
        server_name wabot.miltech.cloud;
        ssl_certificate     /etc/letsencrypt/live/wabot.miltech.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wabot.miltech.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:KesherSSL:10m;
        client_max_body_size 10M;
        location / {
            proxy_pass http://172.22.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }



    # ---- takahim.miltech.cloud (old domain, kept as a redirect to pakahim.miltech.cloud
    #      so existing bookmarks/links keep working - not torn down) ----
    server {
        listen 80;
        server_name takahim.miltech.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name takahim.miltech.cloud;

        ssl_certificate /etc/letsencrypt/live/takahim.miltech.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/takahim.miltech.cloud/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:TakahimSSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        return 301 https://pakahim.miltech.cloud$request_uri;
    }

    # ---- pakahim.miltech.cloud (current domain) ----
    server {
        listen 80;
        server_name pakahim.miltech.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
