        http2 on;
        server_name pakahim.miltech.cloud;

        ssl_certificate /etc/letsencrypt/live/pakahim.miltech.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pakahim.miltech.cloud/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:PakahimSSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
