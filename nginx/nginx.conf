worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frame policy: same protection as the old X-Frame-Options SAMEORIGIN, plus
    # an allowance for the GeniriFlow portfolio site, which embeds this app's
    # landing page as a live preview in its products carousel.
    add_header Content-Security-Policy "frame-ancestors 'self' https://geniriflow.miltech.cloud" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    upstream frontend {
        server yogev-frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server yogev-backend:3001;
        keepalive 32;
    }

    # Amutot platform uses resolver for runtime DNS (containers on external network)

    server {
        listen 80;
        server_name miltech.cloud www.miltech.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name miltech.cloud www.miltech.cloud;


        ssl_certificate /etc/letsencrypt/live/miltech.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/miltech.cloud/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location /uploads {
            alias /var/www/uploads;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
            proxy_connect_timeout 90s;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }
    }

    # =========================================================
    # Amutot Platform — amutot.miltech.cloud
    # =========================================================

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name amutot.miltech.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name amutot.miltech.cloud;

        ssl_certificate /etc/letsencrypt/live/amutot.miltech.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/amutot.miltech.cloud/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:AmutotSSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        resolver 127.0.0.11 valid=10s;
        set $amutot_frontend amutot-frontend:3000;
        set $amutot_backend amutot-backend:3000;

        client_max_body_size 20M;

        location /api {
            proxy_pass http://$amutot_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90s;
        }


        location / {
            proxy_pass http://$amutot_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }
    }

    # =========================================================
    # Communities Platform — comunix.miltech.cloud
    # SPA + API both served by the communities web container,
    # published on host port 3011 (reached via the docker gateway).
    # =========================================================

    # HTTP → HTTPS redirect (acme-challenge served for cert renewal)
    server {
        listen 80;
        server_name comunix.miltech.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — proxy everything to the communities web container.
    # The web container (host port 3011) serves the SPA and proxies /api/v1/*
    # to the api container on its own internal network, so a single upstream
    # is enough. Reached via the docker host gateway because the communities
    # stack lives on a separate docker network (communities_internal).
    server {
        listen 443 ssl;
        http2 on;
        server_name comunix.miltech.cloud;

        ssl_certificate /etc/letsencrypt/live/comunix.miltech.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/comunix.miltech.cloud/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:ComunixSSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 25M;

        location / {
            proxy_pass http://172.20.0.1:3011;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
            proxy_connect_timeout 90s;
        }

        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }
    }

    # =========================================================
    # GeniriFlow Landing — geniriflow.miltech.cloud
    # =========================================================
    server {
        listen 80;
        server_name geniriflow.miltech.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # GeniriFlow Landing — geniriflow.miltech.cloud (HTTPS)
    server {
        listen 443 ssl;
        http2 on;
        server_name geniriflow.miltech.cloud;

        ssl_certificate /etc/letsencrypt/live/geniriflow.miltech.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/geniriflow.miltech.cloud/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:GeniriflowSSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        resolver 127.0.0.11 valid=10s;
        set $geniriflow_web geniriflow-landing:3000;

        client_max_body_size 50M;

        location / {
            proxy_pass http://$geniriflow_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
        }

        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }
    }

    # =========================================================
    # Kursim — kursim.miltech.cloud
    # =========================================================
    server {
        listen 80;
        server_name kursim.miltech.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }


    # Kursim — kursim.miltech.cloud (HTTPS)
    server {
        listen 443 ssl;
        http2 on;
        server_name kursim.miltech.cloud;

        ssl_certificate /etc/letsencrypt/live/kursim.miltech.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kursim.miltech.cloud/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:KursimSSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        resolver 127.0.0.11 valid=10s;
        set $kursim_app kursim-app:3000;

        client_max_body_size 20M;

        # SSE eviction stream: no buffering, long-lived connection
        location /api/auth/events {
            proxy_pass http://$kursim_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location / {
            proxy_pass http://$kursim_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
        }
    }


    # ---- sabanenglish.miltech.cloud  (Yalla, English!) ----
    server {
        listen 80;
        server_name sabanenglish.miltech.cloud;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ---- sabanenglish.miltech.cloud  HTTPS (Yalla, English! -> host :4010) ----
